<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Operations Executive Summary</title><desc id="desc">Executive summary report with jobs completed, average response time, on-time delivery and revenue per truck, a division split chart and an AI-written weekly summary. Fictional data.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#020617"/></linearGradient></defs>
