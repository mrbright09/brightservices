<text x="20" y="136" fill="#5eead4" font-size="11" letter-spacing="1">MAX DEADHEAD</text>
<rect x="20" y="152" width="400" height="8" rx="4" fill="#0b2a3a"/><rect x="20" y="152" width="150" height="8" rx="4" fill="url(#bar)"/><circle cx="170" cy="156" r="11" fill="#ecfdf5" stroke="#00e676" stroke-width="3"/><text x="170" y="190" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">75 mi</text>
