<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Auto-Bid Rules and Guardrails</title><desc id="desc">Carrier settings screen for the auto-bid engine: rate floor and ceiling sliders, lane preferences, approval mode, and a daily summary of bids sent, won and revenue. Fictional data.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131a"/><stop offset="1" stop-color="#020617"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00b4ff"/><stop offset="1" stop-color="#00e676"/></linearGradient></defs>
<rect width="900" height="520" rx="34" fill="url(#bg)"/><rect x="28" y="28" width="844" height="464" rx="28" fill="#06161b" stroke="#0f5132" stroke-width="2"/>
<g font-family="Inter,Arial">
